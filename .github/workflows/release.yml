name: Release

# Push a tag such as v0.1.1 (it must match VERSION_NAME in gradle.properties) after the release is on Maven Central.
# This only checks the repository and attaches the database files to the GitHub release; publishing to Central is done locally with ./gradlew publishAndReleaseToMavenCentral.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # The iOS targets can only be built on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release prerequisites
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :core:jvmTest :data:jvmTest :ui:jvmTest

      # iOS artifacts carry no data (no classpath): consumers add these two files to their app bundle.
      - name: Attach the database files to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            data/build/generated/addressDb/tz-address.db \
            data/build/generated/addressDb/tz-address.db.version
